<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ouvidoria - TechVision</title>
  </head>

  <body>
    <header>
      <h1>Ouvidoria</h1>
    </header>

    <main>
      <section>
        <p>
          Sua opnião é importante para a TechVision. Envie sua sugestão,
          reclamação, elogio ou dúvida.
        </p>

        <form>
          <fieldset>
            <legend>Envie sua opinião</legend>

            <label for="nome">Nome:</label><br />
            <input type="text" id="nome" name="nome" required />

            <br /><br />

            <label for="email">E-mail:</label><br />
            <input type="email" id="email" name="email" required />

            <br /><br />

            <label for="tipo">Tipo:</label><br />
            <select name="tipo" id="tipo">
              <option value="sugestão">Sugestão</option>
              <option value="reclamação">Reclamação</option>
              <option value="elogio">Elogio</option>
              <option value="duvida">Dúviida</option>
            </select>

            <br /><br />

            <label for="mensagem">Mensagem:</label><br />
            <textarea
              name="mensagem"
              id="mensagem"
              rows="6"
              cols="40"
              placeholder="Digite sua mensagem..."
            ></textarea>

            <br /><br />

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
          </fieldset>
        </form>
      </section>
    </main>

    <footer>
      <nav aria-label="Navegação">
        <a href="index_.html">Início</a>
      </nav>
    </footer>
  </body>
</html>
