<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TECHVISION - Monte sua solução</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header>
      <h1>Monte Sua Solução!</h1>
    </header>
      <nav aria-label="Navegação">
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
      </nav>
    <main>
      <section class="informacao">
        <p>
          Não sabe qual produto ou serviço escolher? Responda algumas perguntas
          e monte a solução ideal para você com a TechVision!
        </p>

        <form>
          <fieldset>
            <legend>Monte sua solução</legend>

            <label for="nome">Seu nome:</label><br />
            <input type="text" id="nome" name="nome" />

            <br /><br />

            <fieldset>
              <legend>O que você procura?</legend>
              <input type="radio" id="servico" name="tipo" value="servico" />
              <label for="servico">Serviço</label>

              <input type="radio" id="produto" name="tipo" value="produto" />
              <label for="produto">Produto</label>
            </fieldset>

            <br />

            <label for="categoria">Qual área você prefere?</label><br />
            <select name="categoria" id="categoria">
              <option value="">Escolha uma opção</option>
              <option value="informatica">Informática</option>
              <option value="tecnologia">Tecnologia</option>
              <option value="acessorios">Acessórios</option>
              <option value="manutenção">Menutenção</option>
            </select>

            <br /><br />

            <label for="orcamento">Qual seu orçamento?</label><br />
            <input
              type="number"
              id="orcamento"
              name="orçamento"
              placeholder="R$"
            />

            <br /><br />

            <label for="preferencia"
              >Conte um puco mais sobre o que você procura:</label
            ><br />
            <textarea
              name="preferencia"
              id="preferencia"
              rows="5"
              cols="40"
              placeholder="Ex: Quero algo para melhorar meu computador..."
              required
            ></textarea>

            <br /><br />

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
          </fieldset>
        </form>
      </section>
    </main>

    <footer>
    <p>&copy; 2026 TechVision</p>
    </footer>
  </body>
</html>
