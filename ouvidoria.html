<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouvidoria - TechVision</title>
</head>
<body>
    <center>
    <h1>Ouvidoria</h1>
    </center>
    
    <p>
        Sua opnião é importante para a TechVision.
        Envie sua sugestão, reclamação, elogio ou dúvida.
    </p>

    <form>
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required>
        <br><br>

        <label for="email">E-mail:</label><br>
        <input type="text" id="email" name="email" required>
        <br><br>

        <label for="tipo">Tipo:</label><br>
        <select name="tipo" id="tipo">
            <option value="sugestão">Sugestão</option>
            <option value="reclamação">Reclamação</option>
            <option value="elogio">Elogio</option>
            <option value="duvida">Dúviida</option>
        </select>
        <br><br>

        <label for="mensagme">Mensagem:</label>
        <textarea name="mensagem" id="mensagem" rows="6" cols="40" placeholder="
        Digite sua mensagem..."></textarea>
        <br><br>

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
        <br><br>
        <hr>
        
    </form>
   <h2><a href="index.html">Início</a></h2>
</body>
</html>
